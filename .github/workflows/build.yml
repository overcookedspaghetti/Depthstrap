name: Build & Package

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

env:
  VPK_VERSION: "1.2.161"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true, fetch-tags: true, fetch-depth: 0 }

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          dotnet tool install -g vpk --version $VPK_VERSION

      - name: Fetch previous release (for deltas)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          PRE=""; [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--pre"
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --channel windows-x64 --outputDir .build/velopack $PRE

      - name: Publish
        run: cargo xtask publish

      - uses: actions/upload-artifact@v7
        with:
          name: depthstrap-release-win-x64-${{ github.sha }}
          path: .build/velopack/*
