name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: depthstrap-release-*-${{ github.sha }}
          merge-multiple: true
          path: release

      # Velopack's updater reads the feed files from the release, so upload everything
      - uses: softprops/action-gh-release@v3
        with:
          name: Depthstrap ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: true
          fail_on_unmatched_files: true
          files: release/**/*
